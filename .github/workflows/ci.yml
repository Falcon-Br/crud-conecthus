name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade e integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wenlock_test
          POSTGRES_USER: wenlock
          POSTGRES_PASSWORD: wenlock_test
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U wenlock -d wenlock_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api
      - run: npm run build

  docker-e2e:
    name: Docker e navegador
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_PORT: '8081'
      DB_PORT: '54331'
      COMPOSE_PROJECT_NAME: wenlock-container-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compilar e iniciar imagens de produção
        run: docker compose up -d --build --wait --wait-timeout 120
      - run: npm run test:e2e:docker
      - name: Coletar diagnóstico dos contêineres
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose.log 2>&1
      - name: Guardar relatório e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-report
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
      - name: Encerrar ambiente descartável do runner
        if: always()
        run: docker compose down --volumes --remove-orphans
