name: wenlock
services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://wenlock:wenlock_dev@db:5432/wenlock
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wenlock
      POSTGRES_USER: wenlock
      POSTGRES_PASSWORD: wenlock_dev
    ports:
      - '127.0.0.1:${DB_PORT:-54329}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wenlock -d wenlock']
      interval: 3s
      timeout: 3s
      retries: 20
  db-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: wenlock_test
      POSTGRES_USER: wenlock
      POSTGRES_PASSWORD: wenlock_test
    ports:
      - '127.0.0.1:54330:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wenlock -d wenlock_test']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
